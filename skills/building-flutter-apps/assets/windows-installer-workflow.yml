# Copy this topology, then replace repository-owned commands and resolve every
# action/tool tag to an audited immutable pin before the first dispatch.
# Dispatch the workflow definition from a branch/tag, never a raw SHA:
#   gh workflow run <workflow> --ref <branch-or-tag> -f revision=<40-char-sha>
# The admission owner must prove `github.sha == revision` and remote ref
# readback before paid/native/external work. `actions/checkout` may then use the
# admitted SHA directly.
#
# Keep YAML limited to runner, permission, cache, artifact, and external-write
# boundaries. The orchestration scripts own named internal phases. Compacting
# YAML must never remove these pre-build calls:
#   parse-powershell -> timeout smoke -> CRT smoke -> Inno identity smoke ->
#   Inno install/uninstall settlement smoke -> Flutter build exactly once.
# Contract-test call presence and order inside each orchestration script.
# Same-step tool installers must return/set `ISCC_PATH` in the current
# PowerShell process before internal guards consume it. Writing `GITHUB_ENV`
# alone is only a handoff to a later workflow step.
# Internal PowerShell contracts reject every casing of `$matches` as an owned
# variable and require `@(...)` before `.Count`/index/exact-one consumption.
# Exercise zero/one/many plus regex-validation-then-source-consumption fixtures.
# The same script then stages/proves CRT, runs `dart run inno_bundle --no-app`
# or the accepted custom Inno owner, verifies/scans/lifecycle-tests the EXE,
# and—only in publish mode—uploads immutable bytes, verifies readback, pushes
# the exact release identity, and activates the provider-neutral pointer last.
# Before release upload, bind the deployed service version to its official SDK,
# then exercise candidate size/type, protocol/chunking, and security policy in
# an owned temporary object. Reconcile/delete that exact ID before any retry.
# Build its manifest with the publication schema owner (including `platform`)
# and round-trip the payload through the real signer and verifier; a reduced
# ad hoc preflight map or weaker validator is not publication-contract proof.
# Keep native verification and downstream storage as separate phase receipts.
# Shared YAML does not collapse internal branches: contract same-job codegen vs
# verified transfer and first-release vs upgrade against the same core guards.
# Reuse one semantic release stage DAG across apps. App identity/provider values
# are validated typed configuration or adapters; never fork a copied publisher
# or import another app's IDs. Before a second app publishes, map every stage,
# branch, input/output, order, timeout, failure, and cleanup invariant to the
# proven reference and execute the real adapted branches with controlled stubs.
# Declare universal byte-identical engine files separately from typed config,
# capability adapters, and app-owned product/preservation files. A clean-target
# inventory must prove every configured file, test, helper, and native target;
# never copy reference-only paths/targets or production runtime probes.
# First-release mode skips only the old installer. It still seeds and preserves
# namespaced synthetic AppData/registry/credential fixtures; it never invokes
# the production app executable, provider/storage graph, or real user data.
# Owned child processes use .NET ProcessStartInfo.ArgumentList token by token;
# PowerShell Start-Process -ArgumentList array flattening is not structured argv.
# Prove spaced/empty/quote-bearing arguments through the real helper parser.
# Run portable local checks first, then the exact-format Linux provider
# create/public-read/delete preflight. Run this same orchestration on a clean,
# private-repository, repository-scoped ephemeral/JIT self-hosted Windows
# runner (or directly on a dedicated disposable Windows VM) before paying for
# the sole GitHub-hosted Windows publisher. Never attach a public/shared/
# persistent runner or a production machine holding sensitive user data or live credentials.
# `act` is wiring-only: its images are incomplete and do not provide Windows
# target-native proof from macOS/Linux.
# The orchestration calls `defender-installer-scan.ps1` after installer/lifecycle
# proof. It uses official `-ReturnHR`, fails detections/unknown HRESULTs closed,
# and retries only exact sharing violation `0x80070020` once within its bound.
# Keep scanner parsing + red/green self-tests inside the existing orchestration
# contract; never add YAML steps merely to expose this internal phase.
# After immutable create returns, poll the unauthenticated consumer read for the
# same ID/bytes. Retry only typed `storage_file_not_found`, 429, or 5xx within
# one bound; fail 401/403/mismatch immediately. Recovery never rebuilds,
# version-bumps, deletes, overwrites, or duplicates the immutable release.
# Every Bash entrypoint sets strict mode, resolves its own canonical directory
# from BASH_SOURCE before path use, and is exercised through real provider/helper
# branches with controlled stubs. Static source presence is not execution proof.
# Gateway/download adapters contract literal and one percent-encoded reserved
# form, reject double encoding, authenticate before object lookup, and retain
# safe status/method/redirect/auth-challenge diagnostics. CI must not create a
# temporary runtime user/JWT when an anonymous auth-challenge probe is enough.
# If immutable bytes/tag/manifest exist and activation alone fails, use an
# explicit activation-only recovery that re-verifies and activates them; never
# rebuild, re-upload, retag, or recreate the artifact/manifest.
#
# Verification writes no tag, release, deployment, publication object, pointer,
# or machine install. Publication consumes one exact diagnostic-proven revision.
# Dispatch input contract is checked before any checkout-local action runs:
#   mode = verify-windows | publish
#   revision = 40 lowercase hexadecimal characters, equal to github.sha
#   version = MAJOR.MINOR.PATCH, each component 0 or a non-zero decimal integer
#   diagnostic_run_id = 1-20 decimal digits for publish, empty for verify-windows
# Raw values enter only as environment data. Release commands consume validated
# job outputs through environment variables, never interpolated command source.
name: Flutter Windows installer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify Windows or publish a diagnostic-proven revision
        required: true
        default: verify-windows
        type: choice
        options:
          - verify-windows
          - publish
      revision:
        description: Exact 40-character source commit; must equal the dispatch event SHA
        required: true
        type: string
      version:
        description: Exact application version
        required: true
        type: string
      diagnostic_run_id:
        description: Required only for publish
        required: false
        type: string

permissions: {}

concurrency:
  group: windows-installer-release
  cancel-in-progress: false

jobs:
  validate_inputs:
    name: Validate dispatch inputs before checkout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      revision: ${{ steps.validate.outputs.revision }}
      event_sha: ${{ steps.validate.outputs.event_sha }}
      version: ${{ steps.validate.outputs.version }}
      diagnostic_run_id: ${{ steps.validate.outputs.diagnostic_run_id }}
    steps:
      - name: Validate exact input grammar
        id: validate
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_REVISION: ${{ inputs.revision }}
          DISPATCH_EVENT_SHA: ${{ github.sha }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_RUN_ID: ${{ inputs.diagnostic_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          mode = os.environ.get("DISPATCH_MODE", "")
          revision = os.environ.get("DISPATCH_REVISION", "")
          event_sha = os.environ.get("DISPATCH_EVENT_SHA", "")
          version = os.environ.get("DISPATCH_VERSION", "")
          run_id = os.environ.get("DISPATCH_RUN_ID", "")

          def fail(field: str, value: str) -> None:
              raise SystemExit(f"invalid {field}: length={len(value)}")

          if mode not in {"verify-windows", "publish"}:
              fail("mode", mode)
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              fail("revision", revision)
          if re.fullmatch(r"[0-9a-f]{40}", event_sha) is None:
              fail("event_sha", event_sha)
          if revision != event_sha:
              fail("revision", revision)
          if re.fullmatch(
              r"(?:0|[1-9][0-9]{0,8})\.(?:0|[1-9][0-9]{0,8})\.(?:0|[1-9][0-9]{0,8})",
              version,
          ) is None:
              fail("version", version)
          if run_id and re.fullmatch(r"[0-9]{1,20}", run_id) is None:
              fail("diagnostic_run_id", run_id)
          if mode == "publish" and not run_id:
              fail("diagnostic_run_id", run_id)

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8", newline="\n") as output:
              for name, value in (
                  ("mode", mode),
                  ("revision", revision),
                  ("event_sha", event_sha),
                  ("version", version),
                  ("diagnostic_run_id", run_id),
              ):
                  output.write(f"{name}={value}\n")
          PY

  verify_windows:
    name: Verify Windows without publication
    needs:
      - validate_inputs
    if: needs.validate_inputs.outputs.mode == 'verify-windows'
    runs-on: [self-hosted, windows, x64, windows-installer-proof]
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate_inputs.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up cached release toolchain
        uses: ./.github/actions/setup-release-toolchain

      - name: Build once and prove the complete diagnostic contract
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_MODE: ${{ needs.validate_inputs.outputs.mode }}
          DISPATCH_REVISION: ${{ needs.validate_inputs.outputs.revision }}
          DISPATCH_EVENT_SHA: ${{ needs.validate_inputs.outputs.event_sha }}
          DISPATCH_VERSION: ${{ needs.validate_inputs.outputs.version }}
          DISPATCH_RUN_ID: ${{ needs.validate_inputs.outputs.diagnostic_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DISPATCH_MODE -ne 'verify-windows') {
            throw 'Validated dispatch mode is not verify-windows.'
          }
          & .\.github\scripts\windows_installer.ps1 verify `
            -Revision $env:DISPATCH_REVISION `
            -DispatchRevision $env:DISPATCH_EVENT_SHA `
            -Version $env:DISPATCH_VERSION `
            -Publication none

      - name: Upload short-lived diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/windows-installer/installer.exe
            ${{ runner.temp }}/windows-installer/diagnostic-receipt.json
          if-no-files-found: error
          retention-days: 1

  admission:
    name: Admit exact publication revision
    needs:
      - validate_inputs
    if: needs.validate_inputs.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate_inputs.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up cached release toolchain
        uses: ./.github/actions/setup-release-toolchain

      - name: Test, scan, and prepare an exact-revision handoff
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_MODE: ${{ needs.validate_inputs.outputs.mode }}
          DISPATCH_REVISION: ${{ needs.validate_inputs.outputs.revision }}
          DISPATCH_EVENT_SHA: ${{ needs.validate_inputs.outputs.event_sha }}
          DISPATCH_VERSION: ${{ needs.validate_inputs.outputs.version }}
          DISPATCH_RUN_ID: ${{ needs.validate_inputs.outputs.diagnostic_run_id }}
        run: |
          set -euo pipefail
          test "$DISPATCH_MODE" = publish
          ./.github/scripts/run_linux_release_admission.sh \
            "$DISPATCH_REVISION" \
            "$DISPATCH_EVENT_SHA" \
            "$DISPATCH_VERSION" \
            "$DISPATCH_RUN_ID"

      - name: Upload verified admission handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-admission-${{ needs.validate_inputs.outputs.diagnostic_run_id }}
          path: ${{ runner.temp }}/windows-installer/admission
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Build once and publish verified Windows installer
    needs:
      - validate_inputs
      - admission
    if: needs.validate_inputs.outputs.mode == 'publish'
    runs-on: windows-latest
    timeout-minutes: 90
    environment: windows-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact admitted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate_inputs.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up cached release toolchain
        uses: ./.github/actions/setup-release-toolchain

      - name: Download exact-revision admission handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer-admission-${{ needs.validate_inputs.outputs.diagnostic_run_id }}
          path: ${{ runner.temp }}/windows-installer/admission

      - name: Build once, verify, publish immutable bytes, and activate last
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_TOKEN: ${{ secrets.WINDOWS_PUBLISHER_TOKEN }}
          MANIFEST_SIGNING_KEY: ${{ secrets.WINDOWS_MANIFEST_SIGNING_KEY }}
          DISPATCH_MODE: ${{ needs.validate_inputs.outputs.mode }}
          DISPATCH_REVISION: ${{ needs.validate_inputs.outputs.revision }}
          DISPATCH_EVENT_SHA: ${{ needs.validate_inputs.outputs.event_sha }}
          DISPATCH_VERSION: ${{ needs.validate_inputs.outputs.version }}
          DISPATCH_RUN_ID: ${{ needs.validate_inputs.outputs.diagnostic_run_id }}
          ADMISSION_ROOT: ${{ runner.temp }}\windows-installer\admission
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DISPATCH_MODE -ne 'publish') {
            throw 'Validated dispatch mode is not publish.'
          }
          & .\.github\scripts\windows_installer.ps1 publish `
            -Revision $env:DISPATCH_REVISION `
            -DispatchRevision $env:DISPATCH_EVENT_SHA `
            -Version $env:DISPATCH_VERSION `
            -DiagnosticRunId $env:DISPATCH_RUN_ID `
            -AdmissionRoot $env:ADMISSION_ROOT

      - name: Upload final installer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-windows-installer-v${{ needs.validate_inputs.outputs.version }}
          path: ${{ runner.temp }}/windows-installer/app-windows-installer-v${{ needs.validate_inputs.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 7
