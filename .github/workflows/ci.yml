name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read # Verify the upstream scaffold release.
  pull-requests: read # Find the merged PR whose passed checks cover a base-branch push.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Ruby checks read UTF-8 Markdown and fail under a US-ASCII locale.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_FETCH_REMOTE_VERSIONS_CACHE: 0s
      MISE_PREFER_OFFLINE: 'false'
      MISE_USE_VERSIONS_HOST: 'false'
      MISE_MINIMUM_RELEASE_AGE: 0s
    steps:
      - name: Check out exact tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the shared native tool cache
        run: |
          {
            echo "MISE_DATA_DIR=$RUNNER_TEMP/hard-eng-tools/mise/data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/hard-eng-tools/mise/cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/hard-eng-tools/mise/state"
            echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/hard-eng-tools/bun/cache"
          } >> "$GITHUB_ENV"

      - name: Provide ripgrep with PCRE2
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ripgrep
          fi
          rg --version
          rg --pcre2-version

      - name: Show runtimes
        run: |
          python3 --version
          ruby --version
          pwsh --version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Verify repository with Hard Eng
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bun x --package="@jdxcode/mise-linux-${RUNNER_ARCH,,}@latest" mise --no-config install uv@latest &&
          bun x --package="@jdxcode/mise-linux-${RUNNER_ARCH,,}@latest" mise --no-config exec uv@latest -- uv run --no-project --with pyyaml python .hooks/hard-eng.py check --base "$BASE_SHA"

  upstream-drift:
    name: Upstream flutter/skills drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Clones github.com/flutter/skills and fails when a tracked upstream
      # skill changes, so it can go red without any change in this repo.
      - name: Compare with the locked upstream skill hashes
        run: ruby tool/check_upstream_flutter_skills.rb
