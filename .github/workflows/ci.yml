name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read # Verify the upstream scaffold release.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Ruby checks read UTF-8 Markdown and fail under a US-ASCII locale.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_FETCH_REMOTE_VERSIONS_CACHE: 0s
      MISE_PREFER_OFFLINE: 'false'
      MISE_USE_VERSIONS_HOST: 'false'
      MISE_MINIMUM_RELEASE_AGE: 0s
    steps:
      - name: Check out exact tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the shared native tool cache
        run: |
          {
            echo "MISE_DATA_DIR=$RUNNER_TEMP/hard-eng-tools/mise/data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/hard-eng-tools/mise/cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/hard-eng-tools/mise/state"
            echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/hard-eng-tools/pnpm/store"
            echo "PNPM_CONFIG_CACHE_DIR=$RUNNER_TEMP/hard-eng-tools/pnpm/cache"
          } >> "$GITHUB_ENV"

      - name: Provide ripgrep with PCRE2
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ripgrep
          fi
          rg --version
          rg --pcre2-version

      - name: Show runtimes
        run: |
          python3 --version
          ruby --version
          pwsh --version

      - name: Cache native tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/hard-eng-tools/mise/data/installs
            ${{ runner.temp }}/hard-eng-tools/mise-launcher
            ${{ runner.temp }}/hard-eng-tools/pnpm/store
          key: ${{ runner.os }}-${{ runner.arch }}-hard-eng-tools-${{ hashFiles('.hooks/tool_setup.py', 'hard-eng.gates.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-hard-eng-tools-

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: latest
          runtime: node@latest
          install: false

      - name: Verify repository with Hard Eng
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          pnpm dlx --config.ignore-scripts=false --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config install uv@latest &&
          pnpm dlx --config.ignore-scripts=false --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config exec uv@latest -- uv run --no-project --with pyyaml python .hooks/hard-eng.py check --base "$BASE_SHA"

  upstream-drift:
    name: Upstream flutter/skills drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Clones github.com/flutter/skills and fails when a tracked upstream
      # skill changes, so it can go red without any change in this repo.
      - name: Compare with the locked upstream skill hashes
        run: ruby tool/check_upstream_flutter_skills.rb
