name: Drift Check

on:
  push:
    paths:
      - 'references/**'
      - 'SKILL.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'tool/check_drift.sh'
      - 'tool/check_drift_test.sh'
      - '.github/workflows/drift.yml'
  pull_request:
    paths:
      - 'references/**'
      - 'SKILL.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'tool/check_drift.sh'
      - 'tool/check_drift_test.sh'
      - '.github/workflows/drift.yml'

jobs:
  drift:
    name: Drift regression check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep

      - name: Verify rg available
        run: rg --version

      - name: Run fixture tests
        run: bash tool/check_drift_test.sh

      - name: Run live drift scan
        run: bash tool/check_drift.sh
