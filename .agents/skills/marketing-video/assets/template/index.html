<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marketing video</title>
    <style>
      :root {
        --ink: #111827;
        --accent: #2563eb;
        --highlight: #93c5fd;
        --muted: #6b7280;
        --bg: #f8fafc;
        --dark: #1e3a8a;
        --tint: #e0e7ff;
        --alert: #dc2626;
        --weight: 800;
        --display: Display, sans-serif;
        --body: Body, Display, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); font-family: var(--body); color: var(--ink); -webkit-font-smoothing: antialiased; }
      #stage, #scenes, .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene { visibility: hidden; }
      .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      h1 { font-family: var(--display); font-size: 124px; font-weight: var(--weight); letter-spacing: -0.045em; line-height: 1; text-align: center; }
      h1.huge { font-size: 176px; }
      h1 .accent, .tag b { color: var(--accent); }
      .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.02em 0.12em; margin-bottom: -0.12em; }
      .wi { display: inline-block; }
      .logos { display: flex; align-items: center; gap: 48px; }
      .logos .x { font-size: 72px; font-weight: 300; color: var(--muted); }
      .logo-img { display: block; }
      .sub { font-size: 40px; color: var(--muted); margin-top: 36px; max-width: 1400px; text-align: center; line-height: 1.3; }
      .bands { display: grid; gap: 28px; width: 1640px; margin-top: 76px; }
      .band { display: grid; grid-template-columns: 470px 1fr; align-items: center; gap: 56px; padding: 36px 56px; border-radius: 30px; border: 1.5px solid color-mix(in srgb, var(--accent) 22%, transparent); background: #fff; }
      .band.accent { background: var(--tint); }
      .band .kind { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
      .band .logo { margin-top: 16px; height: 62px; display: flex; align-items: center; }
      .band ul { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 36px; list-style: none; }
      .band li { position: relative; padding-left: 34px; font-family: var(--display); font-size: 32px; font-weight: 500; color: var(--ink); }
      .band li::before { content: ''; position: absolute; left: 0; top: calc(0.62em - 6px); width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
      .rule { width: 120px; height: 6px; border-radius: 3px; background: var(--highlight); margin-top: 28px; }
      .viewport { position: absolute; }
      .screen { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 2px 4px rgba(20, 32, 26, 0.06), 0 30px 80px rgba(20, 32, 26, 0.16); }
      .clip { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
      .clip img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      .chapcard { position: absolute; inset: 0; background: var(--dark); color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 160px; z-index: 5; }
      .chapcard .kick { font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--highlight); margin-bottom: 26px; }
      .chapcard .big { font-family: var(--display); font-size: 168px; font-weight: var(--weight); letter-spacing: -0.05em; line-height: 0.98; max-width: 1600px; }
      .slab { position: absolute; display: flex; align-items: center; gap: 22px; padding: 16px 32px 16px 16px; border-radius: 20px; background: color-mix(in srgb, var(--dark) 70%, #000); color: #fff; box-shadow: 0 24px 60px rgba(8, 20, 14, 0.35); z-index: 3; }
      .slab .n { width: 52px; height: 52px; border-radius: 16px; background: var(--highlight); color: var(--dark); font-family: var(--display); font-size: 34px; font-weight: var(--weight); display: flex; align-items: center; justify-content: center; }
      .slab .t { font-family: var(--display); font-size: 54px; font-weight: var(--weight); letter-spacing: -0.035em; line-height: 1; }
      .slab .fast { font-family: var(--display); font-size: 26px; font-weight: 700; color: rgba(255, 255, 255, 0.55); margin-left: 6px; }
      .collage { position: absolute; width: 560px; height: 315px; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 50px rgba(20, 32, 26, 0.16); background: #fff; }
      .collage img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
      .tag { font-family: var(--display); font-size: 76px; font-weight: var(--weight); line-height: 1.04; letter-spacing: -0.045em; margin-top: 44px; text-align: center; }
      .cta { margin-top: 60px; padding: 28px 60px; border-radius: 999px; background: var(--dark); color: #fff; font-family: var(--display); font-size: 40px; font-weight: var(--weight); }
      .chapcard .num { position: absolute; right: 120px; bottom: -90px; font-family: var(--display); font-size: 520px; font-weight: var(--weight); letter-spacing: -0.06em; line-height: 1; color: rgba(255, 255, 255, 0.08); }
      .cards { display: flex; gap: 48px; margin-top: 90px; }
      .cards .card { width: 760px; padding: 44px 48px 48px; border-radius: 28px; background: #fff; box-shadow: 0 1px 2px rgba(20, 32, 26, 0.06), 0 24px 60px rgba(20, 32, 26, 0.12); }
      .cards .chip { display: inline-flex; align-items: center; gap: 12px; padding: 8px 20px; border-radius: 999px; background: color-mix(in srgb, var(--alert) 12%, #fff); color: var(--alert); font-size: 26px; font-weight: var(--weight); letter-spacing: 0.12em; text-transform: uppercase; }
      .chip i { width: 14px; height: 14px; border-radius: 50%; background: var(--alert); }
      .cards .say { font-family: var(--display); font-size: 58px; font-weight: var(--weight); letter-spacing: -0.035em; line-height: 1.05; margin-top: 26px; }
      .lockup { display: flex; flex-direction: column; align-items: center; }
      .lockup .kick { margin-top: 40px; font-family: var(--display); font-size: 38px; font-weight: var(--weight); letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }
      .lockup h1 { font-size: 184px; margin-top: 8px; }
      .pill { position: absolute; display: flex; align-items: center; gap: 18px; padding: 8px 30px 8px 8px; border-radius: 22px; background: #fff; box-shadow: 0 1px 2px rgba(20, 32, 26, 0.08), 0 12px 32px rgba(20, 32, 26, 0.12); z-index: 4; }
      .pill .n { min-width: 56px; height: 56px; padding: 0 10px; border-radius: 16px; background: var(--accent); color: #fff; font-family: var(--display); font-size: 30px; font-weight: var(--weight); display: flex; align-items: center; justify-content: center; }
      .pill .t { font-family: var(--display); font-size: 34px; font-weight: var(--weight); letter-spacing: -0.03em; }
      .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      .cam img { position: absolute; left: 0; top: 0; opacity: 0; }
      .cursor { position: absolute; left: 0; top: 0; width: 38px; height: 38px; margin: -4px 0 0 -7px; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.28)); }
      .ripple { position: absolute; left: 0; top: 0; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; border: 5px solid var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); opacity: 0; }
      .head { position: absolute; left: 0; right: 0; top: 120px; display: flex; justify-content: center; }
      .head h1 { font-size: 96px; max-width: 1640px; }
      .node { position: absolute; top: 400px; height: 380px; padding: 44px; border-radius: 30px; background: #fff; box-shadow: 0 1px 2px rgba(20, 32, 26, 0.06), 0 30px 70px rgba(20, 32, 26, 0.14); }
      .node .logo-img { margin-bottom: 34px; }
      .node .name { font-family: var(--display); font-size: 60px; font-weight: var(--weight); letter-spacing: -0.04em; line-height: 1; }
      .node .note { font-size: 30px; font-weight: 600; color: var(--muted); margin-top: 16px; line-height: 1.25; }
      .node .rows { margin-top: 22px; }
      .node .row { display: flex; justify-content: space-between; padding: 13px 0; border-top: 2px solid var(--tint); font-size: 32px; font-weight: 700; }
      .node .row b { font-weight: var(--weight); color: var(--accent); }
      .node.hero { background: linear-gradient(140deg, var(--dark), var(--accent)); color: #fff; }
      .node.hero .note { color: rgba(255, 255, 255, 0.75); }
      .node.hero .logo-img { filter: brightness(0) invert(1); }
      .badge { position: absolute; display: inline-flex; align-items: center; gap: 10px; padding: 12px 24px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 28px; font-weight: var(--weight); white-space: nowrap; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25); }
      .badge i { width: 12px; height: 12px; border-radius: 50%; background: var(--highlight); }
      svg.lines { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
      svg .stroke { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      svg .track { fill: none; stroke: var(--tint); stroke-width: 6; }
      svg .dot { fill: var(--accent); }
      .loopmark { position: absolute; left: 960px; top: 610px; transform: translate(-50%, -50%); }
      .lnode { position: absolute; width: 400px; height: 92px; margin: -46px 0 0 -200px; border-radius: 26px; background: #fff; display: flex; align-items: center; justify-content: center; gap: 16px; font-family: var(--display); font-size: 36px; font-weight: var(--weight); letter-spacing: -0.03em; box-shadow: 0 20px 50px rgba(20, 32, 26, 0.14); }
      .lnode .k { width: 44px; height: 44px; border-radius: 14px; background: var(--tint); color: var(--accent); font-size: 24px; display: flex; align-items: center; justify-content: center; }
      .lnode.you { background: linear-gradient(140deg, var(--dark), var(--accent)); color: #fff; }
      .lnode.you .k { background: rgba(255, 255, 255, 0.18); color: #fff; }
      h1.over { position: relative; z-index: 2; }
      #backdrop { position: absolute; inset: 0; overflow: hidden; }
      #backdrop .grid { position: absolute; inset: -64px; background-image: radial-gradient(color-mix(in srgb, var(--accent) 16%, transparent) 1.6px, transparent 1.8px); background-size: 32px 32px; }
      #backdrop .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.75; background: var(--tint); }
      #subs { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; z-index: 50; }
      .subline { position: absolute; bottom: 0; max-width: 1500px; padding: 12px 30px; border-radius: 16px; background: color-mix(in srgb, var(--ink) 86%, transparent); color: #fff; font-size: 30px; font-weight: 600; line-height: 1.3; text-align: center; opacity: 0; }
      .side { position: absolute; left: 160px; bottom: 470px; width: 900px; }
      .side .kick { font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
      .side .big { font-family: var(--display); font-size: 120px; font-weight: var(--weight); letter-spacing: -0.045em; line-height: 1; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="backdrop" hidden><div class="grid"></div></div>
      <div id="scenes"></div>
      <div id="subs"></div>
    </div>
    <script src="gsap.min.js"></script>
    <script src="scenes.js"></script>
    <script src="engine.js"></script>
  </body>
</html>
