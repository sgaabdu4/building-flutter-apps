rules:
  - id: regex-built-in-function-python
    languages: [python]
    severity: ERROR
    message: Compile this constant regex once at module level and reuse it.
    paths: &paths
      exclude:
        &excluded [
          ".agents/",
          "test/",
          "tests/",
          "integration_test/",
          "test_driver/",
          "__tests__/",
          "*Tests/",
          "test_*.py",
          "*_test.py",
          "conftest.py",
          "*.test.*",
          "*.spec.*",
          "*_test.dart",
          "*Tests.swift",
        ]
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
      - pattern: re.$M("...", ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(compile|match|fullmatch|search|sub|subn|split|findall|finditer)$
  - id: regex-built-in-function-javascript
    languages: [javascript, typescript]
    options:
      constant_propagation: false
    severity: ERROR
    message: Build this constant regex once at module level and reuse it.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: function $F(...) { ... }
          - pattern-inside: (...) => { ... }
          - pattern-inside: (...) => $X
          - pattern-inside: "$C.$M = function (...) { ... }"
          - pattern-inside: |
              $M(...) { ... }
      - pattern-either:
          - pattern: new RegExp("...")
          - pattern: new RegExp("...", "=~/^[dimsuv]*$/")
          - pattern: RegExp("...")
          - pattern: RegExp("...", "=~/^[dimsuv]*$/")
          - patterns:
              - pattern: /.../
              - pattern-not-regex: (?<![\w$)\]/])/(?:\\.|\[(?:\\.|[^\]\\\n])*\]|[^/\\\[\n])+/[a-z]*[gy]
  - id: regex-built-in-function-dart
    languages: [dart]
    severity: ERROR
    message: Build this constant regex once as a top-level or static final and reuse it.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: $T $F(...) { ... }
          - pattern-inside: $F(...) { ... }
          - pattern-inside: (...) { ... }
          - pattern-inside: (...) => $X
      - pattern: RegExp("...", ...)
  - id: regex-built-in-function-swift
    languages: [swift]
    severity: ERROR
    message: Build this constant regex once as a global or static let and reuse it.
    paths: *paths
    patterns:
      - pattern-inside: |
          func $F(...) { ... }
      - pattern: 'NSRegularExpression(pattern: "...", ...)'
  - id: bool-array-python
    languages: [python]
    severity: ERROR
    message: >-
      A list of bools stores one object reference per flag. Use a bytearray(n), one byte per flag and as fast
      as a list; pack eight flags per byte only when memory matters. An int bitset rebuilds itself on every write.
    paths: *paths
    pattern-either:
      - pattern: "[False] * $N"
      - pattern: "[True] * $N"
      - pattern: "$N * [False]"
      - pattern: "$N * [True]"
  - id: bool-array-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: Use a bitset (a Uint32Array of words) instead of an array of booleans.
    paths: *paths
    pattern-either:
      - pattern: new Array($N).fill(false)
      - pattern: new Array($N).fill(true)
      - pattern: Array($N).fill(false)
      - pattern: Array($N).fill(true)
      - pattern: "Array.from({length: $N}, () => false)"
      - pattern: "Array.from({length: $N}, () => true)"
  - id: bool-array-dart
    languages: [dart]
    severity: ERROR
    message: Use a bitset (a Uint32List of words) instead of a list of bools.
    paths: *paths
    pattern-either:
      - pattern: List<bool>.filled($N, $V)
      - pattern: List.filled($N, false)
      - pattern: List.filled($N, true)
  - id: bool-array-swift
    languages: [swift]
    severity: ERROR
    message: Use a bitset (an array of UInt64 words) instead of an array of Bool.
    paths: *paths
    pattern-either:
      - pattern: "[Bool](repeating: $V, count: $N)"
      - pattern: "Array(repeating: false, count: $N)"
      - pattern: "Array(repeating: true, count: $N)"
  - id: whole-row-sql-python
    languages: [python]
    options:
      constant_propagation: false
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: $F(...)
          - pattern-inside: $X = $E
          - pattern-inside: return $E
      - pattern: '"$SQL"'
      - metavariable-regex: &select-all
          metavariable: $SQL
          regex: (?is)^(?:(?!exists\s*\(|insert\s+into\b|create\s+(?:temp(?:orary)?\s+)?table\b).)*?\bselect\s+(?:distinct\s+)?(?:[a-z_]\w*\.)?\*\s*(?:,|from\b(?!\s*(?:pg_catalog\.)?(?:unnest|generate_series|json_to_record|json_to_recordset|jsonb_to_record|jsonb_to_recordset|json_each|jsonb_each|json_each_text|jsonb_each_text|json_array_elements|jsonb_array_elements|string_to_table|regexp_split_to_table)\s*\())
  - id: whole-row-sql
    languages: [javascript, typescript]
    options:
      constant_propagation: false
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    patterns:
      - pattern: '"$SQL"'
      - metavariable-regex: *select-all
  - id: whole-row-sql-swift
    languages: [swift]
    options:
      constant_propagation: false
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    patterns:
      - pattern: '"$SQL"'
      - metavariable-regex: *select-all
  - id: whole-row-sql-dart
    languages: [dart]
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    patterns:
      - pattern-regex: (?im)^(?:(?!//)[^\n'"])*(?:(?:'[^'\n]*'|"[^"\n]*")(?:(?!//)[^\n'"])*)*['"](?:(?!exists\s*\(|insert\s+into\b|create\s+(?:temp(?:orary)?\s+)?table\b)[^'"\n])*?\bselect\s+(?:distinct\s+)?(?:[a-z_]\w*\.)?\*\s*(?:,|from\b(?!\s*(?:pg_catalog\.)?(?:unnest|generate_series|json_to_record|json_to_recordset|jsonb_to_record|jsonb_to_recordset|json_each|jsonb_each|json_each_text|jsonb_each_text|json_array_elements|jsonb_array_elements|string_to_table|regexp_split_to_table)\s*\())
      - pattern-not-regex: (?s)/\*.*?\*/
  - id: whole-row-sql-file
    languages: [generic]
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths:
      include: ["*.sql"]
      exclude: *excluded
    patterns:
      - pattern-regex: (?im)^(?:(?!exists\s*\(|insert\s+into\b|create\s+(?:temp(?:orary)?\s+)?table\b)(?:[^'\n-]|'[^'\n]*'|-(?!-)))*?\bselect\s+(?:distinct\s+)?(?:[a-z_]\w*\.)?\*\s*(?:,|from\b(?!\s*(?:pg_catalog\.)?(?:unnest|generate_series|json_to_record|json_to_recordset|jsonb_to_record|jsonb_to_recordset|json_each|jsonb_each|json_each_text|jsonb_each_text|json_array_elements|jsonb_array_elements|string_to_table|regexp_split_to_table)\s*\())
      - pattern-not-regex: (?is)(?:exists\s*\(|insert\s+into\b[^;]*?|create\s+(?:temp(?:orary)?\s+)?table\b[^;]*?\bas\b[^;]*?)\s*select\s+(?:distinct\s+)?(?:[a-z_]\w*\.)?\*\s*(?:,|from\b(?!\s*(?:pg_catalog\.)?(?:unnest|generate_series|json_to_record|json_to_recordset|jsonb_to_record|jsonb_to_recordset|json_each|jsonb_each|json_each_text|jsonb_each_text|json_array_elements|jsonb_array_elements|string_to_table|regexp_split_to_table)\s*\())
      - pattern-not-regex: (?s)/\*.*?\*/
  - id: whole-row-query-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    pattern-either:
      - pattern: $DB.from($T).select()
      - pattern: $DB.from($T).select("*", ...)
      - pattern: $DB.select().from($T)
      - patterns:
          - pattern-either:
              - pattern: "$P.$M.$F({...})"
              - pattern: $P.$M.$F()
          - metavariable-regex:
              metavariable: $F
              regex: ^(findMany|findFirst|findFirstOrThrow|findUnique|findUniqueOrThrow)$
          - pattern-not: "$P.$M.$F({..., select: $S, ...})"
          - pattern-not: "$P.$M.$F({..., omit: $S, ...})"
          - pattern-not: "$P.$M.$F({..., columns: $S, ...})"
  - id: in-process-cache-python
    languages: [python]
    severity: ERROR
    message: Remove this cache and make the underlying work fast instead.
    paths: *paths
    pattern-either:
      - pattern: functools.cache
      - pattern: functools.lru_cache
      - pattern: functools.cached_property
      - pattern: import cachetools
      - pattern: from cachetools import $X
  - id: in-process-cache-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: Remove this cache and make the underlying work fast instead.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern: import $X from "$MOD"
          - pattern: import { $X } from "$MOD"
          - pattern: import * as $X from "$MOD"
          - pattern: require("$MOD")
      - metavariable-regex:
          metavariable: $MOD
          regex: ^(lru-cache|quick-lru|memoize-one|mem|p-memoize|node-cache|memoizee|lodash/memoize|lodash\.memoize|fast-memoize|micro-memoize)$
  - id: in-process-cache-dart
    languages: [dart]
    severity: ERROR
    message: Remove this cache and make the underlying work fast instead.
    paths: *paths
    pattern-either:
      - pattern: AsyncCache(...)
      - pattern: AsyncCache<$T>(...)
      - pattern: AsyncCache.ephemeral(...)
      - pattern: AsyncMemoizer(...)
      - pattern: AsyncMemoizer<$T>(...)
  - id: in-process-cache-swift
    languages: [swift]
    severity: ERROR
    message: Remove this cache and make the underlying work fast instead.
    paths: *paths
    pattern-either:
      - pattern: NSCache<$K, $V>()
      - pattern: NSCache()
  - id: serial-bounded-helper-dart
    languages: [dart]
    paths: *paths
    severity: ERROR
    message: ordered work uses inOrder with a reason.
    options:
      constant_propagation: false
      symbolic_propagation: false
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "mapWithConcurrency($ITEMS, 1, ...)"
              - pattern: "$MODULE.mapWithConcurrency($ITEMS, 1, ...)"
          - pattern-not:
              pattern-either:
                - pattern: "mapWithConcurrency(..., width: $BOUND, ...)"
                - pattern: "mapWithConcurrency(..., limit: $BOUND, ...)"
                - pattern: "mapWithConcurrency(..., concurrency: $BOUND, ...)"
                - pattern: "mapWithConcurrency(..., maxConcurrency: $BOUND, ...)"
                - pattern: "mapWithConcurrency(..., max_concurrency: $BOUND, ...)"
                - pattern: "$MODULE.mapWithConcurrency(..., width: $BOUND, ...)"
                - pattern: "$MODULE.mapWithConcurrency(..., limit: $BOUND, ...)"
                - pattern: "$MODULE.mapWithConcurrency(..., concurrency: $BOUND, ...)"
                - pattern: "$MODULE.mapWithConcurrency(..., maxConcurrency: $BOUND, ...)"
                - pattern: "$MODULE.mapWithConcurrency(..., max_concurrency: $BOUND, ...)"
      - pattern-either:
          - pattern: "mapWithConcurrency(..., width: 1, ...)"
          - pattern: "mapWithConcurrency(..., limit: 1, ...)"
          - pattern: "mapWithConcurrency(..., concurrency: 1, ...)"
          - pattern: "mapWithConcurrency(..., maxConcurrency: 1, ...)"
          - pattern: "mapWithConcurrency(..., max_concurrency: 1, ...)"
          - pattern: "$MODULE.mapWithConcurrency(..., width: 1, ...)"
          - pattern: "$MODULE.mapWithConcurrency(..., limit: 1, ...)"
          - pattern: "$MODULE.mapWithConcurrency(..., concurrency: 1, ...)"
          - pattern: "$MODULE.mapWithConcurrency(..., maxConcurrency: 1, ...)"
          - pattern: "$MODULE.mapWithConcurrency(..., max_concurrency: 1, ...)"
  - id: serial-bounded-helper-javascript
    languages: [javascript, typescript]
    paths: *paths
    severity: ERROR
    message: ordered work uses inOrder with a reason.
    options:
      constant_propagation: false
      symbolic_propagation: false
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "mapLimit($ITEMS, 1, ...)"
              - pattern: "$MODULE.mapLimit($ITEMS, 1, ...)"
              - pattern: "await mapLimit<$T>($ITEMS, 1, ...)"
              - pattern: "await $MODULE.mapLimit<$T>($ITEMS, 1, ...)"
          - pattern-not:
              pattern-either:
                - pattern: "mapLimit(..., {width: $BOUND, ...}, ...)"
                - pattern: "mapLimit(..., {limit: $BOUND, ...}, ...)"
                - pattern: "mapLimit(..., {concurrency: $BOUND, ...}, ...)"
                - pattern: "mapLimit(..., {maxConcurrency: $BOUND, ...}, ...)"
                - pattern: "mapLimit(..., {max_concurrency: $BOUND, ...}, ...)"
                - pattern: "$MODULE.mapLimit(..., {width: $BOUND, ...}, ...)"
                - pattern: "$MODULE.mapLimit(..., {limit: $BOUND, ...}, ...)"
                - pattern: "$MODULE.mapLimit(..., {concurrency: $BOUND, ...}, ...)"
                - pattern: "$MODULE.mapLimit(..., {maxConcurrency: $BOUND, ...}, ...)"
                - pattern: "$MODULE.mapLimit(..., {max_concurrency: $BOUND, ...}, ...)"
                - pattern: "await mapLimit<$T>(..., {width: $BOUND, ...}, ...)"
                - pattern: "await mapLimit<$T>(..., {limit: $BOUND, ...}, ...)"
                - pattern: "await mapLimit<$T>(..., {concurrency: $BOUND, ...}, ...)"
                - pattern: "await mapLimit<$T>(..., {maxConcurrency: $BOUND, ...}, ...)"
                - pattern: "await mapLimit<$T>(..., {max_concurrency: $BOUND, ...}, ...)"
                - pattern: "await $MODULE.mapLimit<$T>(..., {width: $BOUND, ...}, ...)"
                - pattern: "await $MODULE.mapLimit<$T>(..., {limit: $BOUND, ...}, ...)"
                - pattern: "await $MODULE.mapLimit<$T>(..., {concurrency: $BOUND, ...}, ...)"
                - pattern: "await $MODULE.mapLimit<$T>(..., {maxConcurrency: $BOUND, ...}, ...)"
                - pattern: "await $MODULE.mapLimit<$T>(..., {max_concurrency: $BOUND, ...}, ...)"
  - id: serial-bounded-helper-javascript-options
    languages: [javascript, typescript]
    paths: *paths
    severity: ERROR
    message: ordered work uses inOrder with a reason.
    options:
      constant_propagation: false
      symbolic_propagation: false
    patterns:
      - pattern-either:
          - pattern: "mapLimit($...BEFORE, {width: 1, ...}, $...AFTER)"
          - pattern: "mapLimit($...BEFORE, {limit: 1, ...}, $...AFTER)"
          - pattern: "mapLimit($...BEFORE, {concurrency: 1, ...}, $...AFTER)"
          - pattern: "mapLimit($...BEFORE, {maxConcurrency: 1, ...}, $...AFTER)"
          - pattern: "mapLimit($...BEFORE, {max_concurrency: 1, ...}, $...AFTER)"
          - pattern: "$MODULE.mapLimit($...BEFORE, {width: 1, ...}, $...AFTER)"
          - pattern: "$MODULE.mapLimit($...BEFORE, {limit: 1, ...}, $...AFTER)"
          - pattern: "$MODULE.mapLimit($...BEFORE, {concurrency: 1, ...}, $...AFTER)"
          - pattern: "$MODULE.mapLimit($...BEFORE, {maxConcurrency: 1, ...}, $...AFTER)"
          - pattern: "$MODULE.mapLimit($...BEFORE, {max_concurrency: 1, ...}, $...AFTER)"
          - pattern: "await mapLimit<$T>($...BEFORE, {width: 1, ...}, $...AFTER)"
          - pattern: "await mapLimit<$T>($...BEFORE, {limit: 1, ...}, $...AFTER)"
          - pattern: "await mapLimit<$T>($...BEFORE, {concurrency: 1, ...}, $...AFTER)"
          - pattern: "await mapLimit<$T>($...BEFORE, {maxConcurrency: 1, ...}, $...AFTER)"
          - pattern: "await mapLimit<$T>($...BEFORE, {max_concurrency: 1, ...}, $...AFTER)"
          - pattern: "await $MODULE.mapLimit<$T>($...BEFORE, {width: 1, ...}, $...AFTER)"
          - pattern: "await $MODULE.mapLimit<$T>($...BEFORE, {limit: 1, ...}, $...AFTER)"
          - pattern: "await $MODULE.mapLimit<$T>($...BEFORE, {concurrency: 1, ...}, $...AFTER)"
          - pattern: "await $MODULE.mapLimit<$T>($...BEFORE, {maxConcurrency: 1, ...}, $...AFTER)"
          - pattern: "await $MODULE.mapLimit<$T>($...BEFORE, {max_concurrency: 1, ...}, $...AFTER)"
      - pattern-not: "mapLimit($...BEFORE, {..., ...$SPREAD, ...}, $...AFTER)"
      - pattern-not: "mapLimit($...BEFORE, {width: $FIRST, width: $SECOND, ...}, $...AFTER)"
      - pattern-not: "mapLimit($...BEFORE, {limit: $FIRST, limit: $SECOND, ...}, $...AFTER)"
      - pattern-not: "mapLimit($...BEFORE, {concurrency: $FIRST, concurrency: $SECOND, ...}, $...AFTER)"
      - pattern-not: "mapLimit($...BEFORE, {maxConcurrency: $FIRST, maxConcurrency: $SECOND, ...}, $...AFTER)"
      - pattern-not: "mapLimit($...BEFORE, {max_concurrency: $FIRST, max_concurrency: $SECOND, ...}, $...AFTER)"
      - pattern-not: "$MODULE.mapLimit($...BEFORE, {..., ...$SPREAD, ...}, $...AFTER)"
      - pattern-not: "$MODULE.mapLimit($...BEFORE, {width: $FIRST, width: $SECOND, ...}, $...AFTER)"
      - pattern-not: "$MODULE.mapLimit($...BEFORE, {limit: $FIRST, limit: $SECOND, ...}, $...AFTER)"
      - pattern-not: "$MODULE.mapLimit($...BEFORE, {concurrency: $FIRST, concurrency: $SECOND, ...}, $...AFTER)"
      - pattern-not: "$MODULE.mapLimit($...BEFORE, {maxConcurrency: $FIRST, maxConcurrency: $SECOND, ...}, $...AFTER)"
      - pattern-not: "$MODULE.mapLimit($...BEFORE, {max_concurrency: $FIRST, max_concurrency: $SECOND, ...}, $...AFTER)"
      - pattern-not: "await mapLimit<$T>($...BEFORE, {..., ...$SPREAD, ...}, $...AFTER)"
      - pattern-not: "await mapLimit<$T>($...BEFORE, {width: $FIRST, width: $SECOND, ...}, $...AFTER)"
      - pattern-not: "await mapLimit<$T>($...BEFORE, {limit: $FIRST, limit: $SECOND, ...}, $...AFTER)"
      - pattern-not: "await mapLimit<$T>($...BEFORE, {concurrency: $FIRST, concurrency: $SECOND, ...}, $...AFTER)"
      - pattern-not: "await mapLimit<$T>($...BEFORE, {maxConcurrency: $FIRST, maxConcurrency: $SECOND, ...}, $...AFTER)"
      - pattern-not: "await mapLimit<$T>($...BEFORE, {max_concurrency: $FIRST, max_concurrency: $SECOND, ...}, $...AFTER)"
      - pattern-not: "await $MODULE.mapLimit<$T>($...BEFORE, {..., ...$SPREAD, ...}, $...AFTER)"
      - pattern-not: "await $MODULE.mapLimit<$T>($...BEFORE, {width: $FIRST, width: $SECOND, ...}, $...AFTER)"
      - pattern-not: "await $MODULE.mapLimit<$T>($...BEFORE, {limit: $FIRST, limit: $SECOND, ...}, $...AFTER)"
      - pattern-not: "await $MODULE.mapLimit<$T>($...BEFORE, {concurrency: $FIRST, concurrency: $SECOND, ...}, $...AFTER)"
      - pattern-not: "await $MODULE.mapLimit<$T>($...BEFORE, {maxConcurrency: $FIRST, maxConcurrency: $SECOND, ...}, $...AFTER)"
      - pattern-not: "await $MODULE.mapLimit<$T>($...BEFORE, {max_concurrency: $FIRST, max_concurrency: $SECOND, ...}, $...AFTER)"
  - id: serial-bounded-helper-python
    languages: [python]
    paths: *paths
    severity: ERROR
    message: ordered work uses inOrder with a reason.
    options:
      constant_propagation: false
      symbolic_propagation: false
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "map_with_concurrency($ITEMS, 1, ...)"
              - pattern: "$MODULE.map_with_concurrency($ITEMS, 1, ...)"
          - pattern-not:
              pattern-either:
                - pattern: "map_with_concurrency(..., width=$BOUND, ...)"
                - pattern: "map_with_concurrency(..., limit=$BOUND, ...)"
                - pattern: "map_with_concurrency(..., concurrency=$BOUND, ...)"
                - pattern: "map_with_concurrency(..., maxConcurrency=$BOUND, ...)"
                - pattern: "map_with_concurrency(..., max_concurrency=$BOUND, ...)"
                - pattern: "$MODULE.map_with_concurrency(..., width=$BOUND, ...)"
                - pattern: "$MODULE.map_with_concurrency(..., limit=$BOUND, ...)"
                - pattern: "$MODULE.map_with_concurrency(..., concurrency=$BOUND, ...)"
                - pattern: "$MODULE.map_with_concurrency(..., maxConcurrency=$BOUND, ...)"
                - pattern: "$MODULE.map_with_concurrency(..., max_concurrency=$BOUND, ...)"
      - pattern-either:
          - pattern: "map_with_concurrency(..., width=1, ...)"
          - pattern: "map_with_concurrency(..., limit=1, ...)"
          - pattern: "map_with_concurrency(..., concurrency=1, ...)"
          - pattern: "map_with_concurrency(..., maxConcurrency=1, ...)"
          - pattern: "map_with_concurrency(..., max_concurrency=1, ...)"
          - pattern: "$MODULE.map_with_concurrency(..., width=1, ...)"
          - pattern: "$MODULE.map_with_concurrency(..., limit=1, ...)"
          - pattern: "$MODULE.map_with_concurrency(..., concurrency=1, ...)"
          - pattern: "$MODULE.map_with_concurrency(..., maxConcurrency=1, ...)"
          - pattern: "$MODULE.map_with_concurrency(..., max_concurrency=1, ...)"
  - id: serial-bounded-helper-swift
    languages: [swift]
    paths: *paths
    severity: ERROR
    message: ordered work uses inOrder with a reason.
    options:
      constant_propagation: false
      symbolic_propagation: false
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "mapWithConcurrency($ITEMS, 1, ...)"
              - pattern: "$MODULE.mapWithConcurrency($ITEMS, 1, ...)"
              - pattern: "mapWithConcurrency($ITEMS, 1, ...) { ... }"
              - pattern: "$MODULE.mapWithConcurrency($ITEMS, 1, ...) { ... }"
          - pattern-not:
              pattern-either:
                - pattern: "mapWithConcurrency(..., width: $BOUND, ...)"
                - pattern: "mapWithConcurrency(..., limit: $BOUND, ...)"
                - pattern: "mapWithConcurrency(..., concurrency: $BOUND, ...)"
                - pattern: "mapWithConcurrency(..., maxConcurrency: $BOUND, ...)"
                - pattern: "mapWithConcurrency(..., max_concurrency: $BOUND, ...)"
                - pattern: "$MODULE.mapWithConcurrency(..., width: $BOUND, ...)"
                - pattern: "$MODULE.mapWithConcurrency(..., limit: $BOUND, ...)"
                - pattern: "$MODULE.mapWithConcurrency(..., concurrency: $BOUND, ...)"
                - pattern: "$MODULE.mapWithConcurrency(..., maxConcurrency: $BOUND, ...)"
                - pattern: "$MODULE.mapWithConcurrency(..., max_concurrency: $BOUND, ...)"
                - pattern: "mapWithConcurrency(..., width: $BOUND, ...) { ... }"
                - pattern: "mapWithConcurrency(..., limit: $BOUND, ...) { ... }"
                - pattern: "mapWithConcurrency(..., concurrency: $BOUND, ...) { ... }"
                - pattern: "mapWithConcurrency(..., maxConcurrency: $BOUND, ...) { ... }"
                - pattern: "mapWithConcurrency(..., max_concurrency: $BOUND, ...) { ... }"
                - pattern: "$MODULE.mapWithConcurrency(..., width: $BOUND, ...) { ... }"
                - pattern: "$MODULE.mapWithConcurrency(..., limit: $BOUND, ...) { ... }"
                - pattern: "$MODULE.mapWithConcurrency(..., concurrency: $BOUND, ...) { ... }"
                - pattern: "$MODULE.mapWithConcurrency(..., maxConcurrency: $BOUND, ...) { ... }"
                - pattern: "$MODULE.mapWithConcurrency(..., max_concurrency: $BOUND, ...) { ... }"
      - pattern-either:
          - pattern: "mapWithConcurrency(..., width: 1, ...)"
          - pattern: "mapWithConcurrency(..., limit: 1, ...)"
          - pattern: "mapWithConcurrency(..., concurrency: 1, ...)"
          - pattern: "mapWithConcurrency(..., maxConcurrency: 1, ...)"
          - pattern: "mapWithConcurrency(..., max_concurrency: 1, ...)"
          - pattern: "$MODULE.mapWithConcurrency(..., width: 1, ...)"
          - pattern: "$MODULE.mapWithConcurrency(..., limit: 1, ...)"
          - pattern: "$MODULE.mapWithConcurrency(..., concurrency: 1, ...)"
          - pattern: "$MODULE.mapWithConcurrency(..., maxConcurrency: 1, ...)"
